  <title>Rental Deal Analyzer | Free Rental Property Calculator</title>
  <meta name="description" content="Free rental property deal analyzer. Calculate cash flow, cap rate, cash-on-cash return, equity, and deal score instantly." />

  <!-- Favicon / App Icon -->

  <!-- ================= SEO SCHEMA: RENTAL DEAL CALCULATOR ================= -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "Rental Deal Analyzer",
    "applicationCategory": "FinanceApplication",
    "operatingSystem": "Web",
    "url": "https://www.rentaldealanalyzer.com/",
    "description": "Free rental property calculator to analyze cash flow, cap rate, cash-on-cash return, equity percentage, operating expenses, cash required at closing, and rental deal score.",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    },
    "creator": {
      "@type": "Organization",
      "name": "Rental Deal Analyzer",
      "url": "https://www.rentaldealanalyzer.com/"
    },
    "featureList": [
      "Cash Flow Calculator",
      "Net Operating Income (NOI)",
      "Cap Rate Calculation",
      "Cash-on-Cash Return",
      "Equity Percentage",
      "Operating Expense Breakdown",
      "Cash Required at Closing",
      "Rental Deal Score",
      "Excel Export",
      "PDF Export"
    ],
    "potentialAction": {
      "@type": "UseAction",
      "target": {
        "@type": "EntryPoint",
        "urlTemplate": "https://rentdealanalyzer.streamlit.app/",
        "actionPlatform": [
          "https://schema.org/DesktopWebPlatform",
          "https://schema.org/MobileWebPlatform"
        ]
      },
      "name": "Analyze Rental Property Deal"
    }
  }
  </script>

  <!-- ================= SEO SCHEMA: FAQ BOOST ================= -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "Is the Rental Deal Analyzer free?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes. Rental Deal Analyzer is completely free to use for analyzing rental property investments."
        }
      },
      {
        "@type": "Question",
        "name": "What does the Rental Deal Analyzer calculate?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "It calculates cash flow, net operating income (NOI), cap rate, cash-on-cash return, equity percentage, operating expenses, cash required at closing, and a rental deal score."
        }
      },
      {
        "@type": "Question",
        "name": "Do you store my financial data?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "No. All calculations run in real time and no data is stored."
        }
      },
      {
        "@type": "Question",
        "name": "Can I download my rental analysis?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes. You can download your rental deal analysis as Excel or PDF."
        }
      }
    ]
  }
  </script>

    .grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
